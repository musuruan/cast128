name: Release

on:
  push:
    tags:
      - "v*"
  
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
    
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: cast128*

