name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65 vice

      - name: Build d64 disk image
        run: |
          make

      - name: Upload d64
        uses: actions/upload-artifact@v7
        with:
          name: cast128
          path: cast128.d64
          if-no-files-found: error
          retention-days: 7

